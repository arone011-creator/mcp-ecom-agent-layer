name: headphones-under-200
# Workflow 3 from section 5. The only fixture that writes, so it is the
# only one that cleans up: a cart left full is state the next run
# inherits, and the run after that reads as a different agent.
#
# Section 5's wording verbatim, INCLUDING the 4+ rating clause -- which
# no product in this catalogue can satisfy, because every product's
# rating is null. Correct behaviour against that data is to decline, so
# this fixture skips rather than scoring the agent for the shop's empty
# rating column. 03b measures the cart path that this one cannot.
utterance: >-
  Find me headphones under $200 with a 4+ rating and add the best one to
  my cart.
requires: [rated_products]
expect:
  required: [search_products, add_to_cart]
  allowed: [get_product, check_inventory, get_cart]
  forbidden: [cancel_order]
cleanup: clear_cart
