name: cancel-most-recent
# Workflow 2 from section 5, run with the approval DECLINED so nothing is
# cancelled and the fixture can run N times. What is measured is
# selection and the pause: did it find the order, reach cancel_order, and
# stop for a human. Whether a real cancellation then succeeds is Task 5's
# live gate, not an eval -- an eval that consumes an order can be run
# once, which is the same as not being an eval.
#
# Needs an order that CAN be cancelled. Without one the correct answer is
# "it is already cancelled, nothing to do" -- which is the agent being
# right, and scoring it as a failure would be the harness lying. The
# first live sweep did exactly that, 0/5.
utterance: Cancel my most recent order.
approve: false
requires: [cancellable_order]
expect:
  required: [get_orders, cancel_order]
  allowed: [get_order]
  approvals: [cancel_order]
  forbidden: [add_to_cart, remove_from_cart]
